name: Build CTAN Zip (Nix)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create-release:
        type: boolean
        description: Publish on GitHub Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31.11.2
      - uses: Mic92/hestia@v3

      - name: Preheat Nix env
        run: nix develop --command true

      - name: Generate Version and Tag
        id: version
        run: |
          NOW=$(date -u +%s)
          echo "version=$(nix develop --command just version $NOW)" >> $GITHUB_OUTPUT
          echo "tag=$(nix develop --command just tag $NOW)" >> $GITHUB_OUTPUT

      - name: Build Package
        run: nix develop --command just ctan ${{ steps.version.outputs.version }}

      - name: Rename Package
        run: mv user-persona.tar.gz user-persona-${{ steps.version.outputs.version }}.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: user-persona-${{ steps.version.outputs.version }}.tar.gz
          compression-level: 0

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create-release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.tag }}"
          name: "Release ${{ steps.version.outputs.version }}"
          files: user-persona-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
